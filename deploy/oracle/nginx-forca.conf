# Site do jogo no Nginx da Oracle, no padrão dos outros sites da instância.
# Instalar:
#   sudo cp nginx-forca.conf /etc/nginx/sites-available/forca.ambrosias.dev
#   sudo ln -s /etc/nginx/sites-available/forca.ambrosias.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d forca.ambrosias.dev     # a zona é Full: sem certificado a origem não atende
server {
    listen 80;
    server_name forca.ambrosias.dev;
    include snippets/cloudflare-only.conf;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O snippet de segurança já envia estes dois; evita cabeçalho duplicado.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        # O gateway pode levar ~17 s no pior caso de troca de servidor.
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }
}
