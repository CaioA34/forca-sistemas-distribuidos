# Site do jogo no Nginx da Oracle. O DNS de forca.ambrosias.dev fica na Cloudflare (proxy ligado).
# Ajuste o bloco de TLS ao padrão dos outros sites da instância antes de ativar.
server {
    listen 80;
    listen [::]:80;
    server_name forca.ambrosias.dev;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O gateway pode levar ~15 s no pior caso de troca de servidor.
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }
}
